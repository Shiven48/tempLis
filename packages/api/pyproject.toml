[project]
name = "my-api"
version = "0.1.0"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.23",
    "requests>=2.31.0",
    "python-multipart>=0.0.6"
]
description = "Laboratory Results API with FastAPI and SQLite"
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
packages = ["src"]  # Adjust this based on your actual directory structure

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "pytest-asyncio>=0.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
