# As the parser is simpler and does all the heavy lifting we will 
# keep the parser key simple as just the field name and its index value 

device: Erba
protocol: HL7
transport:
  mode: tcp
  port: 15200
  host: 127.0.0.1 
parser:
  MSH: 
    model: 3
    machine: 4
    datetime_of_message: 7
  PID:
    patient_id: 3
    patient_name: 5
    gender: 8
  OBR:
    requested_timing: 6
    reservation_timing: 7
    approved_timing: 22
  OBX:
    test_code: 3
    test_name: 3
    result_value: 5
    units: 6
    reference_range: 7
    flags: 8
  